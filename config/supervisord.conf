[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
umask=0027

[program:log-nginx-access]
command=/usr/bin/tail -n +1 -F /logs/nginx/access.log
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:log-nginx-error]
command=/usr/bin/tail -n +1 -F /logs/nginx/error.log
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:log-php-error]
command=/usr/bin/tail -n +1 -F /logs/php/error.log
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:php-fpm]
command=php-fpm85 -F
priority=20
umask=0022
redirect_stderr=true
stdout_logfile=/logs/php/error.log
stdout_logfile_maxbytes=0
autorestart=false
startretries=0

[program:nginx]
command=nginx -g 'daemon off;'
priority=20
umask=0022
stdout_logfile=/logs/nginx/access.log
stdout_logfile_maxbytes=0
stderr_logfile=/logs/nginx/error.log
stderr_logfile_maxbytes=0
autorestart=false
startretries=0

[program:logrotate-cron]
command=/bin/bash -c 'h5ai-logs tick; exec /usr/sbin/crond -f -d 8 -c /etc/h5ai-crontabs'
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
